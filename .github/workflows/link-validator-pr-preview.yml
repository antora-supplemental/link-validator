# Optional: comment link-validator summary on PRs that build a pages preview.
# Enable by uncommenting the pages-preview artifact download step for your hub.
name: Link Validator PR preview comment

on:
  workflow_dispatch:
  # pull_request:
  #   types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validator (JSON)
        run: |
          npx --yes github:antora-supplemental/asciidoc-link-validator#main \
            --root . --out link-report.json --format json || true
      - name: PR comment
        if: github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('link-report.json')) return
            const report = JSON.parse(fs.readFileSync('link-report.json', 'utf8'))
            const s = report.summary || {}
            const body = [
              '<!-- link-validator-pr -->',
              '### Link Validator (PR)',
              `Invalid: **${s.invalid || 0}** · Newly: **${s.newlyInvalid || 0}** · Group: \`${s.groupingDefault || 'n/a'}\``,
              '',
              'Full triage publishes to \`/link-validator/\` on the preview site when the hub wires it.',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100
            })
            const existing = comments.find(c => c.body && c.body.includes('<!-- link-validator-pr -->'))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body
              })
            }
