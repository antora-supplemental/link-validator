# Optional write-back: commit baseline on default branch and/or open/update an issue.
# Uses the core CLI from @antora-supplemental/asciidoc-link-validator.
# Commented steps stay off so a naive copy remains read-only.
name: Link Validator write-back

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  writeback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run core validator (write baseline)
        run: |
          # After publish:
          #   pnpm dlx @antora-supplemental/asciidoc-link-validator --root . --baseline .link-baseline.json --write-baseline --out link-report.json
          npx --yes github:antora-supplemental/asciidoc-link-validator#main --root . --baseline .link-baseline.json --write-baseline --out link-report.json

